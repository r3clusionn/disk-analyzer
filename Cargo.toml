[package]
name = "dux"
version = "0.1.0"
edition = "2021"
description = "Parallel disk usage scanner with hard link, symlink loop and permission handling and an interactive tree."
license = "MIT"

[lib]
name = "dux"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
